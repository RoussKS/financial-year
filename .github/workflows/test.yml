# Workflow name
name: PHP Unit Tests

# Triggers
on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
      - 'develop'

# Jobs/Pipelines
jobs:
  php-unit:
    name: 'PHP Unit'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          coverage: "${{ matrix.php == '8.5' && 'xdebug' || 'none' }}"
          tools: composer:v2, phpunit

      - name: 'Get composer cache directory'
        id: composer-cache
        run: 'echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT'

      - name: 'Cache dependencies'
        uses: actions/cache@v4
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-php-${{ matrix.php}}-composer-${{ hashFiles('**/composer.json') }}"
          restore-keys: "${{ runner.os }}-php-${{ matrix.php}}-composer-"

      - name: 'Install Composer dependencies'
        run: composer install --no-ansi --no-interaction --no-progress --no-scripts --prefer-dist

      - name: 'Run PHPUnit'
        if: matrix.php != '8.5'
        run: phpunit

      - name: 'Run PHPUnit with coverage'
        if: matrix.php == '8.5'
        run: XDEBUG_MODE=coverage phpunit --coverage-clover=coverage.xml

      - name: 'Upload coverage to Codecov'
        if: matrix.php == '8.5'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
