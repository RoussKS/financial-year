# Workflow name
name: Static Analysis

# Triggers
on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
      - 'develop'

# Jobs/Pipelines
jobs:
  phpstan:
    name: 'PHP Stan'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ 7.1, 7.2, 7.3, 7.4, 8.0, 8.1, 8.2 ]
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          tools: phpstan:v1

      - name: PHPStan Static Analysis
        run: phpstan analyse src
