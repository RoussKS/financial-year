# Workflow name
name: Static Analysis

# Triggers
on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
      - 'develop'

# Jobs/Pipelines
jobs:
  phpstan:
    name: 'PHP Stan'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.1, 8.2, 8.3, 8.4, 8.5]
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          tools: phpstan:v2

      - name: PHPStan Static Analysis
        run: phpstan analyse
